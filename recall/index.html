<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17231d">
  <title>Recall Search</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">JOHN SECOND BRAIN</p><h1>過去の自分を探す</h1></header>
    <form id="search-form">
      <label for="query">何を前に調べましたか？</label>
      <div class="search-row"><input id="query" required autocomplete="off"><button>検索</button></div>
    </form>
    <p id="status" role="status"></p>
    <section id="results" aria-live="polite"></section>
    <section id="synthesis" hidden><h2>過去の記録によるまとめ</h2><div id="answer"></div></section>
    <details><summary>接続設定</summary>
      <label>GAS URL<input id="endpoint" type="url"></label>
      <label>共有トークン<input id="token" type="password"></label>
      <button id="save" type="button">この端末に保存</button>
    </details>
  </main>
  <script src="app.js"></script>
</body>
</html>
